name: Probe extra match stats (throwaway)

on:
  push:
    branches: [claude/repo-design-review-ajtl4n]
    paths: [probe2.py, .github/workflows/probe.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python probe2.py
