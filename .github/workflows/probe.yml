name: Probe WSL Fantasy feeds (throwaway)

# Throwaway diagnostic, scoped to this feature branch only — investigates
# whether wslfootball.com's fantasy-game JSON feeds are a usable free data
# source for the women's site (see wsl_probe.py). Not workflow_dispatch:
# GitHub only registers that trigger for workflows already on the default
# branch, and this never should be. Delete this workflow and wsl_probe.py
# once the investigation is done.
on:
  push:
    branches: [claude/repo-design-review-ajtl4n]
    paths: [wsl_probe.py, .github/workflows/probe.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python wsl_probe.py
