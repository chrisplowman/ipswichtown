name: Build & deploy Ipswich stats

on:
  # Two-tier refresh (UTC): a dense sweep across the full range of Premier League
  # kickoff-to-final-whistle windows (earliest KO ~11:30 UTC, latest full time
  # ~22:00 UTC, across both GMT and BST) so a finished match's data lands within
  # ~15 minutes, and an hourly cadence the rest of the day for non-matchday
  # freshness (news, table, injury news).
  schedule:
    - cron: "*/15 11-22 * * *"
    - cron: "0 0-10,23 * * *"
  push:
    branches: [main]
  workflow_dispatch:        # lets you trigger a rebuild by hand from the Actions tab

# Least-privilege permissions needed to publish Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; don't cancel an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Gate: run the test suite (incl. the full-site smoke build) before doing
      # anything else. If tests fail the job stops here, so a broken build never
      # reaches the deploy step (deploy `needs: build`).
      - name: Run tests
        run: |
          pip install pytest
          python -m pytest -q

      # Finished-match detail never changes, so persist it between runs. Keyed per run
      # so each build saves a fresh snapshot; restore-keys pulls the most recent one.
      - name: Restore match cache
        uses: actions/cache@v4
        with:
          path: match_cache
          key: match-cache-${{ github.run_id }}
          restore-keys: |
            match-cache-

      # Finished-match bookings/subs (ESPN play-by-play) never change either.
      - name: Restore play cache
        uses: actions/cache@v4
        with:
          path: play_cache
          key: play-cache-${{ github.run_id }}
          restore-keys: |
            play-cache-

      # Finished-match lineups (ESPN summary endpoint) never change either.
      - name: Restore lineup cache
        uses: actions/cache@v4
        with:
          path: lineup_cache
          key: lineup-cache-${{ github.run_id }}
          restore-keys: |
            lineup-cache-

      # ClubElo's current-day snapshot changes daily, unlike the other caches above
      # (which key on permanently-finished matches) — this isn't a "never expires"
      # cache, it's a fallback for a transient fetch failure, so ingest.py always
      # tries a fresh fetch first and only reads this if that fails.
      - name: Restore ClubElo cache
        uses: actions/cache@v4
        with:
          path: clubelo_cache
          key: clubelo-cache-${{ github.run_id }}
          restore-keys: |
            clubelo-cache-

      - name: Fetch data
        run: python ingest.py

      # Best-effort: FotMob's API is unofficial/undocumented and could break
      # without notice, so a failure here shouldn't fail the whole deploy —
      # data/ isn't persisted between runs, so if this fails or is skipped,
      # build.py falls back to sample_data_women() for that build.
      - name: Fetch women's team data
        run: python ingest_women.py || echo "ingest_women.py failed — women's site will build from sample data this run"
        continue-on-error: true

      - name: Build site
        env:
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
        run: python build.py

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
