name: Build & deploy Ipswich stats

on:
  # Refresh a few times a day (UTC). Matchdays are covered by the 3-hourly cadence.
  schedule:
    - cron: "0 * * * *"
  push:
    branches: [main]
  workflow_dispatch:        # lets you trigger a rebuild by hand from the Actions tab

# Least-privilege permissions needed to publish Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; don't cancel an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Gate: run the test suite (incl. the full-site smoke build) before doing
      # anything else. If tests fail the job stops here, so a broken build never
      # reaches the deploy step (deploy `needs: build`).
      - name: Run tests
        run: |
          pip install pytest
          python -m pytest -q

      # Finished-match detail never changes, so persist it between runs. Keyed per run
      # so each build saves a fresh snapshot; restore-keys pulls the most recent one.
      - name: Restore match cache
        uses: actions/cache@v4
        with:
          path: match_cache
          key: match-cache-${{ github.run_id }}
          restore-keys: |
            match-cache-

      # Finished-match bookings/subs (ESPN play-by-play) never change either.
      - name: Restore play cache
        uses: actions/cache@v4
        with:
          path: play_cache
          key: play-cache-${{ github.run_id }}
          restore-keys: |
            play-cache-

      - name: Fetch data
        run: python ingest.py

      # Best-effort: TheSportsDB's women's-football coverage is thin and this
      # hasn't had a real run yet, so a failure here shouldn't fail the whole
      # deploy — data/ isn't persisted between runs, so if this fails or is
      # skipped, build.py falls back to sample_data_women() for that build.
      - name: Fetch women's team data
        run: python ingest_women.py || echo "ingest_women.py failed — women's site will build from sample data this run"
        continue-on-error: true

      - name: Build site
        run: python build.py

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
